services:
  web:
    image: node:24-bookworm-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - path: /run/base44/app.env
        required: false
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(async r => { if (!r.ok || !(await r.text()).includes('/src/main.jsx')) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  node_modules:
